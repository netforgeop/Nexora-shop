<section class="section section--sm" data-account-page data-wishlist-page>
  <div class="container">
    <div class="with-sidebar">
      <aside class="with-sidebar__aside">{{> account-nav}}</aside>
      <div>
        <div class="account-panel">
          <div class="account-panel__head">
            <h1 class="account-panel__title">{{t "account.wishlist"}} <span class="text-muted small fw-medium" data-wishlist-count></span></h1>
            <div class="cluster" data-wishlist-actions hidden>
              <button type="button" class="btn btn--dark btn--sm" data-wishlist-add-all>{{icon "cart-add" size="xs"}}{{t "wishlist.addAll"}}</button>
              <button type="button" class="btn btn--ghost btn--sm text-danger" data-wishlist-clear>{{icon "trash2" size="xs"}}{{t "wishlist.clear"}}</button>
            </div>
          </div>
          <div data-wishlist-filled hidden><div data-wishlist-items></div></div>
          <div data-wishlist-empty hidden>
            {{{empty iconName="heart" title=L.wishlist.empty text=L.wishlist.emptyText cta=L.common.goToShop href=shopHref}}}
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
