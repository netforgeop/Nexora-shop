<!-- Dynamic product page: renders the product given by ?slug= (or ?id=) from the runtime catalog. -->
<div data-product-dynamic>
  <section class="section section--sm" data-product-loading>
    <div class="container">
      <div class="product-layout">
        <div class="skeleton" style="aspect-ratio:1;border-radius:var(--radius-md)"></div>
        <div class="stack">
          <div class="skeleton skeleton--text" style="inline-size:30%"></div>
          <div class="skeleton skeleton--text" style="block-size:1.6em"></div>
          <div class="skeleton skeleton--text" style="inline-size:80%"></div>
          <div class="skeleton skeleton--text" style="inline-size:60%"></div>
          <div class="skeleton" style="block-size:120px;border-radius:var(--radius-md)"></div>
          <div class="skeleton" style="block-size:48px;inline-size:60%"></div>
        </div>
      </div>
    </div>
  </section>
  <section class="section" data-product-notfound hidden>
    <div class="container">
      {{{empty iconName="cube" title=L.product.notFound text=L.product.notFoundText cta=L.common.goToShop href=shopHref}}}
    </div>
  </section>
  <div data-product-target></div>
</div>
